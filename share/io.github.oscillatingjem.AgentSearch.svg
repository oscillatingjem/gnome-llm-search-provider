<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Agent Search: a magnifying glass over a row of agents. -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#3d3846"/>

  <!-- the row of agents: a head and rounded shoulders each, no features -->
  <g fill="#9a9996">
    <circle cx="32" cy="58" r="8"/>
    <path d="M19 80a13 12 0 0 1 26 0z"/>
    <circle cx="96" cy="58" r="8"/>
    <path d="M83 80a13 12 0 0 1 26 0z"/>
  </g>

  <!-- the lens, with the middle agent magnified inside it -->
  <circle cx="64" cy="62" r="24" fill="#5e5c64"/>
  <g fill="#ffffff">
    <circle cx="64" cy="54" r="9.5"/>
    <path d="M48.5 78a15.5 14 0 0 1 31 0z"/>
  </g>
  <circle cx="64" cy="62" r="24" fill="none" stroke="#f6f5f4" stroke-width="6"/>
  <path d="M81 79l17 17" stroke="#f6f5f4" stroke-width="10" stroke-linecap="round"/>
</svg>
