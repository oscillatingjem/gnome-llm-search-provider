<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Agent Search: a magnifying glass picking out one agent from a lineup.
       Three archetypes, each two colors: skin (fill) and outfit (`color`).
         Scholar     beret, round glasses, bow tie, cardigan
         Operative   fedora, sunglasses, trench coat and tie (the one in the lens)
         Technician  beanie, headset with mic, zip jacket                          -->
  <defs>
    <clipPath id="lens"><circle cx="64" cy="64" r="20"/></clipPath>

    <g id="scholar">
      <path d="M18 84a14 13 0 0 1 28 0z" fill="currentColor"/>
      <path d="M27.5 72l4.5 8 4.5-8z"/>                                     <!-- cardigan V -->
      <path d="M28.6 72.4l3.4 1.6 3.4-1.6v3.2l-3.4-1.6-3.4 1.6z" fill="currentColor"/>  <!-- bow tie -->
      <circle cx="32" cy="60" r="8"/>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="28.4" cy="59.6" r="2.6"/><circle cx="35.6" cy="59.6" r="2.6"/>
        <path d="M31 59.4h2"/>
      </g>
      <ellipse cx="31" cy="53.2" rx="10.5" ry="3.6" fill="currentColor"/>  <!-- beret -->
      <circle cx="33.5" cy="49.2" r="1.6" fill="currentColor"/>
    </g>

    <g id="operative">
      <path d="M18 84a14 13 0 0 1 28 0z" fill="currentColor"/>
      <path d="M28 72l4 6 4-6z"/>
      <path d="M31 73h2l.6 5-1.6 2-1.6-2z" fill="currentColor"/>
      <circle cx="32" cy="60" r="8"/>
      <g fill="currentColor">
        <rect x="24.6" y="57.4" width="6.6" height="4.4" rx="1.6"/>
        <rect x="32.8" y="57.4" width="6.6" height="4.4" rx="1.6"/>
        <rect x="30" y="58.2" width="4" height="1.4"/>
        <rect x="20" y="52" width="24" height="3.4" rx="1.7"/>
        <path d="M25 52.5l1.6-8.5q5.4-2.6 10.8 0l1.6 8.5z"/>
      </g>
    </g>

    <g id="technician">
      <path d="M18 84a14 13 0 0 1 28 0z" fill="currentColor"/>
      <rect x="31.3" y="72.5" width="1.4" height="11.5"/>                   <!-- zip -->
      <circle cx="32" cy="60" r="8"/>
      <g fill="currentColor">
        <path d="M23.6 57a8.4 8.6 0 0 1 16.8 0z"/>                          <!-- beanie -->
        <rect x="23" y="54.6" width="18" height="3.6" rx="1.2"/>
        <rect x="21.4" y="57" width="3.6" height="7.4" rx="1.6"/>          <!-- headset -->
        <rect x="39" y="57" width="3.6" height="7.4" rx="1.6"/>
        <path d="M23.2 63.6q0 4.4 5.4 4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="29" cy="68.2" r="1.4"/>
      </g>
    </g>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#3d3846"/>

  <!-- the lineup, in grayscale -->
  <use href="#scholar" x="-7" fill="#c0bfbc" color="#77767b"/>
  <use href="#technician" x="71" fill="#c0bfbc" color="#77767b"/>

  <!-- the lens: the operative, magnified, gray skin and red outfit -->
  <circle cx="64" cy="64" r="23" fill="#5e5c64"/>
  <g clip-path="url(#lens)">
    <use href="#operative" fill="#c0bfbc" color="#e01b24"
         transform="translate(64 67.5) scale(1.04) translate(-32 -64)"/>
  </g>
  <!-- glass: a faint frosted half and a curved glint through the middle -->
  <g clip-path="url(#lens)" fill="#ffffff">
    <path d="M44 84L84 44L84 40L40 40L40 84z" opacity="0.10"/>
    <path d="M50 74q6-14 24-22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.24"/>
    <path d="M55 77q2.5-4 6-6.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.18"/>
  </g>
  <circle cx="64" cy="64" r="23" fill="none" stroke="#f6f5f4" stroke-width="6"/>
  <path d="M80.5 80.5l16 16" stroke="#f6f5f4" stroke-width="10" stroke-linecap="round"/>
</svg>
