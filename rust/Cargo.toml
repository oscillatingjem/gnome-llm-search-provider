[workspace]
members = ["core", "platform", "cli", "ui"]
resolver = "3"

[workspace.package]
version = "0.6.0-dev"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/oscillatingjem/gnome-llm-search-provider"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[workspace.dependencies]
agent-search-core = { path = "core" }
agent-search-platform = { path = "platform" }
glib = "0.22"
gio = "0.22"
soup3 = "0.9"
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
